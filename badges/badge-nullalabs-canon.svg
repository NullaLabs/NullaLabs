<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" width="280" height="48">
  <defs>
    <style>
      
      
      .btn-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', 'Fira Code', monospace, sans-serif;
        font-weight: 900;
        font-size: 13px;
        fill: #FFFFFF !important;
        stroke: #000000;
        stroke-width: 1.5px;
        paint-order: stroke fill;
        letter-spacing: 1.5px;
        filter: drop-shadow(0 0 6px #FFD700C0);
      }

      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', 'Fira Code', monospace, sans-serif;
        font-weight: 700;
        font-size: 8px;
        fill: #FFD700;
        letter-spacing: 1.2px;
      }

      .glow-border {
        animation: borderGlow 4s ease-in-out infinite alternate;
      }

      @keyframes borderGlow {
        0% { stroke: #FFD700; filter: drop-shadow(0 0 3px #FFD700); }
        50% { stroke: #FFAB00; filter: drop-shadow(0 0 5px #FFAB00); }
        100% { stroke: #FFD700; filter: drop-shadow(0 0 3px #FFD700); }
      }

      .pulse-dot {
        animation: pulse 1.8s infinite;
      }
      
      @keyframes pulse {
        0% { fill: #FFD700; opacity: 1; filter: drop-shadow(0 0 5px #FFD700); }
        50% { fill: #FFD700; opacity: 0.3; filter: drop-shadow(0 0 1px #FFD700); }
        100% { fill: #FFD700; opacity: 1; filter: drop-shadow(0 0 5px #FFD700); }
      }
    </style>

    <clipPath id="clip-badgenullalabscanonsvg">
      <rect width="280" height="48" rx="12" />
    </clipPath>

    <linearGradient id="grad-badgenullalabscanonsvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E" />
      <stop offset="50%" stop-color="#0C1222" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
  </defs>

  <g clip-path="url(#clip-badgenullalabscanonsvg)">
    <rect width="280" height="48" rx="12" fill="url(#grad-badgenullalabscanonsvg)" />
    <line x1="0" y1="24" x2="280" y2="24" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" />
  </g>

  <rect class="glow-border" x="1.5" y="1.5" width="277" height="45" rx="10.5" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-opacity="0.9" />

  <circle class="pulse-dot" cx="20" cy="24" r="4.5" fill="#FFD700" />

  <text x="36" y="22" class="btn-text">SOVEREIGN CANON</text>
  <text x="36" y="36" class="sub-text">47 GOLDEN RULES & INVARIANTS</text>
</svg>