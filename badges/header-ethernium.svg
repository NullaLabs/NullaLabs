<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" width="100%" height="240">
  <defs>
    <style>
      
      
      .title-text {
        font-family: 'Nebula', 'Orbitron', monospace;
        font-weight: 900;
        font-size: 18px;
        fill: #FFFFFF !important;
        stroke: #000000;
        stroke-width: 2px;
        paint-order: stroke fill;
        letter-spacing: 3px;
        filter: drop-shadow(0px 0px 8px #00F0FFCC);
      }

      .subtitle-text {
        font-family: 'Nebula', 'Orbitron', 'Fira Code', monospace;
        font-weight: 700;
        font-size: 13px;
        fill: #00F0FF;
        letter-spacing: 3.5px;
        filter: drop-shadow(0px 0px 6px #7000FFAA);
      }
      
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', 'Fira Code', monospace, sans-serif;
        font-size: 10.5px;
        fill: #94A3B8;
        letter-spacing: 2px;
      }
      
      .pulse-dot {
        animation: pulse 1.8s infinite;
      }
      
      @keyframes pulse {
        0% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
        50% { fill: #00F0FF; opacity: 0.4; filter: drop-shadow(0 0 2px #00F0FF); }
        100% { fill: #00FF9D; opacity: 1; filter: drop-shadow(0 0 6px #00FF9D); }
      }

      .glow-border {
        animation: borderGlow 4s ease-in-out infinite alternate;
      }

      @keyframes borderGlow {
        0% { stroke: #00F0FF; filter: drop-shadow(0 0 4px #00F0FF); }
        50% { stroke: #7000FF; filter: drop-shadow(0 0 6px #7000FF); }
        100% { stroke: #00FF9D; filter: drop-shadow(0 0 4px #00FF9D); }
      }

      .sheen-anim {
        animation: moveSheen 5s ease-in-out infinite alternate;
      }

      @keyframes moveSheen {
        0% { transform: translateX(-350px); }
        100% { transform: translateX(350px); }
      }
    </style>

    <clipPath id="card-ethernium-corner-clip">
      <rect width="950" height="240" rx="16" />
    </clipPath>

    <!-- Engraved Inset 3D Obsidian Base -->
    <linearGradient id="card-ethernium-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="30%" stop-color="#070B14" />
      <stop offset="70%" stop-color="#0A0F1E" />
      <stop offset="100%" stop-color="#010204" />
    </linearGradient>

    <linearGradient id="card-ethernium-glass-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7000FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="card-ethernium-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#card-ethernium-corner-clip)">
    <!-- Base Frame -->
    <rect width="950" height="240" rx="16" fill="url(#card-ethernium-base)" stroke="#000000" stroke-width="4"/>
    
    <!-- Tri-stroke Engraved Inset -->
    <rect x="3" y="3" width="944" height="234" rx="14" fill="none" stroke="#000000" stroke-width="3" opacity="0.9"/>
    <rect x="5" y="5" width="940" height="230" rx="13" fill="none" stroke="url(#card-ethernium-glass-bevel)" stroke-width="1.5" />
    <rect x="7" y="7" width="936" height="226" rx="12" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />

    <!-- Moving Light Sheen -->
    <g class="sheen-anim">
      <polygon points="100,0 350,0 150,240 -100,240" fill="url(#card-ethernium-sheen)" />
    </g>

    <!-- Corner L-Accents -->
    <path d="M 18 18 L 75 18 M 18 18 L 18 75" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 932 18 L 875 18 M 932 18 L 932 75" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 18 222 L 75 222 M 18 222 L 18 165" class="glow-border" stroke-width="3.5" fill="none" />
    <path d="M 932 222 L 875 222 M 932 222 L 932 165" class="glow-border" stroke-width="3.5" fill="none" />

    <!-- NULLA-LABS Top Command Bar -->
    <rect x="40" y="20" width="870" height="28" rx="8" fill="#020408" stroke="#000000" stroke-width="2"/>
    <rect x="41" y="21" width="868" height="26" rx="7" fill="none" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="60" cy="34" r="4.5" class="pulse-dot" />
    <text x="76" y="38" class="badge-text">NULLA-LABS // OFFICIAL ETHERNIUM ENGRAVED OBSIDIAN MONOLITH</text>
    <text x="780" y="38" class="badge-text" fill="#00FF9D">[ENGRAVED_ACTIVE]</text>

    <!-- Title and Subtitle -->
    <g transform="translate(475, 115)">
      <text text-anchor="middle" class="title-text">Ethernium Sovereign Agent Profile</text>
    </g>

    <g transform="translate(475, 198)">
      <text text-anchor="middle" class="subtitle-text">AUTONOMOUS ARCHITECTURES • GPU ENGINE • CONTROL SYSTEMS</text>
    </g>

    <line x1="140" y1="216" x2="810" y2="216" stroke="url(#card-ethernium-glass-bevel)" stroke-width="2.5" />
  </g>
</svg>