name: profile-contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Verify Profile README Contract & Local Assets
        run: node scripts/check_profile.mjs
      - name: Verify Scientific Lab Syntax & Smoke Contracts
        run: |
          node --check demo/app.js
          node demo/tests/smoke.mjs
          node demo/tests/release-baseline.mjs
