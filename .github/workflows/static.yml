name: Deploy Demo to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "demo/**"
      - "MASTER_PLAN.md"
      - "VERIFICATION.md"
      - ".gitattributes"
      - ".github/workflows/static.yml"
      - ".github/workflows/companion-telemetry.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "demo/**"
      - "MASTER_PLAN.md"
      - "VERIFICATION.md"
      - ".gitattributes"
      - ".github/workflows/static.yml"
      - ".github/workflows/companion-telemetry.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax and scientific contracts
        run: |
          node --check demo/app.js
          node demo/tests/smoke.mjs
          node demo/tests/release-baseline.mjs

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build allowlisted Pages artifact
        run: |
          mkdir -p _site/demo
          cp demo/index.html demo/app.js demo/periodic-table-data.js _site/demo/
          cp -R demo/vendor demo/src _site/demo/
          cp demo/index.html demo/app.js demo/periodic-table-data.js _site/
          cp -R demo/vendor demo/src _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
